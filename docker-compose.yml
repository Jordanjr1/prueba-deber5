version: '3.4'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_server_db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Skrillex1."
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "Skrillex1."
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    networks:
      - red-microservicios

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "admin"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - red-microservicios

  microservicio.auth:
    image: microservicioauth
    build:
      context: ./Microservicio_Auth
      dockerfile: Dockerfile
    container_name: microservicio.auth-1
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
    networks:
      - red-microservicios

  microservicio.categoria:
    image: microserviciocategoria
    build:
      context: ./Microservicio_Categoria/Microservicio_Categoria
      dockerfile: Dockerfile
    container_name: microservicio.categoria-1
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__ConexionSql: "Server=sql_server_db,1433;Database=CategoriaDB;User Id=Categoria_V;Password=Skrillex1.;TrustServerCertificate=True;Encrypt=False;"
      ConnectionStrings__DefaultConnection: "Server=sql_server_db,1433;Database=CategoriaDB;User Id=Categoria_V;Password=Skrillex1.;TrustServerCertificate=True;Encrypt=False;"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: admin
      RabbitMQ__Password: admin
    depends_on:
      sqlserver:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - red-microservicios

  microservicio.vehiculo:
    image: microserviciovehiculo
    build:
      context: ./Microservicio_Vehiculo/Microservicio_Vehiculo
      dockerfile: Dockerfile
    container_name: microservicio.vehiculo-1
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__ConexionSql: "Server=sql_server_db,1433;Database=VehiculoDB;User Id=Vehiculos;Password=Skrillex1.;TrustServerCertificate=True;Encrypt=False;"
      ConnectionStrings__DefaultConnection: "Server=sql_server_db,1433;Database=VehiculoDB;User Id=Vehiculos;Password=Skrillex1.;TrustServerCertificate=True;Encrypt=False;"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: admin
      RabbitMQ__Password: admin
    depends_on:
      sqlserver:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - red-microservicios

  apigateway:
    image: apigatewayvehiculos
    build:
      context: ./ApiGateway_Vehiculos/ApiGateway_Vehiculos
      dockerfile: Dockerfile
    container_name: apigateway-1
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ReverseProxy__Clusters__authCluster__Destinations__authDestination__Address: "http://microservicio.auth:8080/"
      ReverseProxy__Clusters__categoriasCluster__Destinations__categoriasDestination__Address: "http://microservicio.categoria:8080/"
      ReverseProxy__Clusters__vehiculosCluster__Destinations__vehiculosDestination__Address: "http://microservicio.vehiculo:8080/"
    depends_on:
      - microservicio.auth
      - microservicio.categoria
      - microservicio.vehiculo
    networks:
      - red-microservicios

volumes:
  mssqldata:

networks:
  red-microservicios:
    driver: bridge